<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aktivasi Google Authenticator - P263</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b12;color:#f8fafc;font-family:Arial,sans-serif;padding:18px;box-sizing:border-box}.card{width:min(430px,100%);box-sizing:border-box;background:#111827;border:1px solid #475569;border-radius:16px;padding:24px;box-shadow:0 15px 40px #0008}h1{font-size:22px;margin-top:0}p{color:#cbd5e1;font-size:14px;line-height:1.5}label{display:block;margin:14px 0 6px;font-size:13px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #475569;border-radius:8px;background:#080b12;color:white;font-size:16px}button{width:100%;padding:12px;margin-top:16px;background:#2563eb;color:white;border:0;border-radius:8px;font-weight:bold;font-size:15px}#result{margin-top:16px;text-align:center}#result img{max-width:100%;background:white;padding:10px;border-radius:8px}a{color:#93c5fd}</style></head><body><main class="card"><h1>Aktifkan Google Authenticator</h1><p>Masukkan username dan password admin. QR hanya ditampilkan jika OTP_SETUP_ENABLED di Vercel disetel ke <b>true</b>.</p><form id="setup"><label for="username">Username admin</label><input id="username" autocomplete="username" required><label for="password">Password admin</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Tampilkan QR Code</button></form><div id="result" aria-live="polite"></div><p><a href="/">Kembali ke halaman login</a></p></main><script>const form=document.getElementById('setup'),result=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();result.textContent='Memuat QR Code…';try{const r=await fetch('/api/otp-setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal membuat QR.');result.innerHTML='';const img=document.createElement('img');img.src=d.qr;img.alt='QR Code Google Authenticator';result.appendChild(img);const p=document.createElement('p');p.textContent=d.message;result.appendChild(p);}catch(err){result.textContent=err.message;}});</script></body></html>
